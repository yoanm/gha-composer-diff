name: 'TODO'
branding:
  icon: 'package'
  color: 'orange'
description: |
  In case lock file is updated, action will output versions differences as step summary

inputs:
  lock-file:
    required: true
    description: 'Path to the lock file from the repository root'
    default: 'composer.lock'
  req-file:
    required: true
    description: 'Path to the requirement file from the repository root'
    default: 'composer.json'
  with-step-summary:
    required: true
    description: 'Whether to output the summary in the step summary'
    default: true

outputs:
  summary:
    value: ${{ steps.summary-builder.outputs.step_summary }}
    description: 'Summary of the differences between the previous and current files'

runs:
  using: "composite"
  steps:
    # Even if an input is marked as "required", an empty value (or no value) may be passed !
    - name: Validate inputs
      uses: actions/github-script@v7
      env:
        INPUT_LOCK-FILE: ${{ inputs.lock-file }}
        INPUT_REQ-FILE: ${{ inputs.req-file }}
      with:
        script: |
          core.info('Validate inputs');
          
          core.getInput('lock-file', {required: true});
          core.getInput('req-file', {required: true});

    #### TODO
    #### - Manage push vs pr (for head and base sha)
    #### - Manage OS + Proc (for the binary to run)
    #### - Consider using github-script to download the files (easier/faster than a checkout, which is actually fetch under the user workspace)

    - name: Fetch previous files
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: current
        sparse-checkout: |
          ${{ inputs.req-file }}
          ${{ inputs.lock-file }}

    - name: Fetch current files
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: previous
        sparse-checkout: |
          ${{ inputs.req-file }}
          ${{ inputs.lock-file }}
        sparse-checkout-cone-mode: false

    - name: Perform diff
      run: |
        ${{ github.action_path }}/bin/linux-amd64-wrapper \
          -previous-req previous/${{ inputs.req-file }} \
          -previous-lock previous/${{ inputs.lock-file }} \
          -current-req current/${{ inputs.req-file }} \
          -current-lock current/${{ inputs.lock-file }} \
        > summary.md
      shell: bash

    - name: Build summary
      id: summary-builder
      run: |
        echo "# 🔎 Composer packages 🔍 " > step_summary.md
        cat summary.md >> step_summary.md
        
        echo "step_summary<<__SUMMARY_EOF__" >> $GITHUB_OUTPUT
        cat step_summary.md >> $GITHUB_OUTPUT
        echo "__SUMMARY_EOF__" >> $GITHUB_OUTPUT
      shell: bash

    - name: Post summary
      if: inputs.with-step-summary == 'true'
      run: cat step_summary.md >> $GITHUB_STEP_SUMMARY
      shell: bash
